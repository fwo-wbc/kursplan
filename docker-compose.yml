# ============================================================
# docker-compose.yml – Kursplan-App (Produktion)
#
# Build-Kontext: ./app (Dockerfile + .dockerignore dort)
# Konfiguration: ./.env.production (wird zur LAUFZEIT injiziert,
#                landet NICHT im Image)
#
# Nutzung:
#   docker compose up -d --build
# ============================================================

services:
  kursplan-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: kursplan-app:latest
    container_name: kursplan-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
